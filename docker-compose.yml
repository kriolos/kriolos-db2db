services:
  db2db-web:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    image: zettais/db2db-web:latest
    container_name: db2db-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - QUARKUS_HTTP_PORT=8080
      - DB2DB_CONFIG_PATH=/deployments/conf/db2db.conf
    depends_on:
      postgres-target:
        condition: service_healthy
      mariadb-target:
        condition: service_healthy
    networks:
      - db2db-net

  postgres-target:
    image: postgis/postgis:17-3.5
    container_name: db2db-postgres-target
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: targetdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d targetdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db2db-net

  mariadb-target:
    image: mariadb:11.4
    container_name: db2db-mariadb-target
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=128M
    environment:
      MARIADB_ROOT_PASSWORD: secretpassword
      MARIADB_DATABASE: targetdb
      MARIADB_USER: mariadb
      MARIADB_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db2db-net

networks:
  db2db-net:
    driver: bridge

volumes:
  pgdata:
  mariadbdata:
