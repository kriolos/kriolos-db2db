name: CI Build & Test

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Verify (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Verify Maven & Java Environment
        run: ./mvnw -version

      - name: Execute Full Reactor Build & Unit Tests
        run: ./mvnw clean verify --batch-mode --no-transfer-progress
