# DB2DB by ZettaIS - Core i18n Messages (English)

# Step Names & Descriptions
step.PRE_FLIGHT_CHECK.name=Pre-Flight Check
step.PRE_FLIGHT_CHECK.description=Verifies network connectivity, credentials, database versions, and required target extensions

step.SCHEMA_ASSESSMENT.name=Schema Assessment
step.SCHEMA_ASSESSMENT.description=Inspects metadata catalog, calculates migration complexity score, invalid objects, and keywords

step.PRE_SCHEMA_SETUP.name=Target Schema Setup
step.PRE_SCHEMA_SETUP.description=Initializes PostgreSQL target schema and enables extensions (postgis, btree_gin, uuid-ossp)

step.DDL_EXPORT.name=DDL Generation
step.DDL_EXPORT.description=Generates PostgreSQL-compatible DDL scripts for tables, sequences, views, and types

step.DDL_APPLY.name=DDL Schema Application
step.DDL_APPLY.description=Applies structural DDL (tables without deferred FKs/indexes) against target PostgreSQL

step.PARALLEL_DATA_STREAMING.name=Parallel Data Streaming
step.PARALLEL_DATA_STREAMING.description=High-throughput data extraction and streaming into PostgreSQL via Virtual Threads

step.POST_DATA_INDEXES.name=Index Creation
step.POST_DATA_INDEXES.description=Builds primary keys, unique, secondary, and spatial/GIN indexes post-load for speed

step.FOREIGN_KEYS.name=Foreign Key Constraints
step.FOREIGN_KEYS.description=Applies deferred foreign key relationships and integrity constraints

step.PROCEDURAL_CODE.name=PL/SQL Transpilation & Deployment
step.PROCEDURAL_CODE.description=Transpiles Oracle stored procedures, functions, packages to PL/pgSQL

step.SEQUENCE_SYNC.name=Sequence Synchronization
step.SEQUENCE_SYNC.description=Synchronizes sequence counters with table maximum IDs in PostgreSQL

step.DATA_VALIDATION_AUDIT.name=Data Validation Audit
step.DATA_VALIDATION_AUDIT.description=Executes row count and checksum reconciliation between Source and Target

step.FINAL_AUDIT_REPORT.name=Final Audit Report
step.FINAL_AUDIT_REPORT.description=Compiles comprehensive JSON and executive HTML audit migration reports

